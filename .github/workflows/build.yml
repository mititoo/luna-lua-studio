
name: build windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller lupa

      - name: build exe
        run: |
          pyinstaller --onefile --windowed --name LunaLuaStudio app.py

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: LunaLuaStudio-windows-exe
          path: dist/LunaLuaStudio.exe
